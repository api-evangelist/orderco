generated: '2026-08-04'
method: probed
source: >-
  Live error probes against https://www.order.co/wp-json on 2026-08-04, cross-checked against
  openapi/orderco-content-openapi.yml. Every code below was observed in a real response; none is
  copied from generic WordPress documentation.
format: wordpress-rest
rfc9457: false
summary: >-
  Order.co publishes no error reference. The only public surface that returns error bodies is the
  WordPress REST API, and it uses the WordPress error object - `code`, `message`,
  `data.status`, optionally `data.params` and `data.details` - served as application/json, not
  RFC 9457 application/problem+json. The Statuspage v2 API returned HTTP 200 on all eight probed
  paths and no error body was observed there. Nothing at all is known about the error model of
  the customer-facing procurement API, because it is undocumented.
envelope:
  content_type: application/json; charset=UTF-8
  fields:
    code: Machine-readable WordPress error code.
    message: Human-readable message, English only.
    data.status: HTTP status, duplicated inside the body.
    data.params: Map of parameter name to a validation message. Present on rest_invalid_param.
    data.details: Per-parameter detail object carrying a nested code such as rest_not_in_enum.
  problem_json: false
problem_types:
- code: rest_post_invalid_id
  http_status: 404
  title: Invalid post ID
  message: Invalid post ID.
  observed_at: GET /wp/v2/posts/999999, GET /wp/v2/customer_story/1
  remediation: >-
    Resolve identifiers from a collection read or from /wp/v2/search before requesting an item.
    Ids are not stable across post types - id 1 exists as a page but not as a customer_story.
- code: rest_no_route
  http_status: 404
  title: No route matched
  message: No route was found matching the URL and request method.
  observed_at: GET /wp/v2/nonexistent
  remediation: >-
    Read the route table at https://www.order.co/wp-json/ first; it is the authoritative list and
    it is what openapi/orderco-content-openapi.yml was generated from.
- code: rest_invalid_param
  http_status: 400
  title: Parameter validation failed
  message: 'Invalid parameter(s): <name>'
  observed_at: GET /wp/v2/posts?per_page=999, GET /wp/v2/faqs?orderby=bogus
  detail_codes:
  - code: rest_out_of_bounds
    example: per_page must be between 1 (inclusive) and 100 (inclusive)
  - code: rest_not_in_enum
    example: >-
      orderby is not one of author, date, id, include, modified, parent, relevance, slug,
      include_slugs, and title.
  remediation: >-
    The per-parameter enums and bounds are published in the discovery document and carried into
    the generated OpenAPI; validate client-side against those rather than probing.
- code: rest_post_invalid_page_number
  http_status: 400
  title: Page number beyond the last page
  message: The page number requested is larger than the number of pages available.
  observed_at: GET /wp/v2/posts?page=999
  remediation: >-
    Read X-WP-TotalPages from the first response, or follow the RFC 8288 Link rel="next" chain
    and stop when it is absent.
- code: rest_forbidden
  http_status: 401
  title: Anonymous access not permitted
  message: Sorry, you are not allowed to access this resource.
  observed_at: GET /wp/v2/users, GET /wp-abilities/v1/abilities
  remediation: >-
    These are administrative routes. There is no public credential that opens them; they are
    excluded from the generated OpenAPI for that reason. Note the status code is 401, not 403,
    even though the code reads "forbidden".
not_observed:
  status_api:
    note: >-
      All eight https://status.order.co/api/v2 paths returned HTTP 200 anonymously. No 4xx or 5xx
      body was produced, so no error type is asserted for that surface.
  product_api:
    note: >-
      The procurement, AP and vendor APIs are undocumented and unreachable without credentials.
      No error catalog can be recorded for them without inventing one.
provider_gaps:
- Publish an error reference for the customer API, with codes, meanings and remediation.
- Adopt RFC 9457 application/problem+json for new surfaces.
- Return a correlation id in error bodies so a caller can quote it to support.
