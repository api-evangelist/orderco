traversal_notes:
- >-
  `_embed=1` inlines linked terms, media and authors in one call, avoiding the id-resolution
  round trips the relationships above would otherwise require.
- >-
  The `industry` taxonomy is the only vocabulary that spans four content types, so it is the
  practical entry point for "everything Order.co has published about hospitality".
