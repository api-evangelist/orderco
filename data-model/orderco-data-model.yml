source: >-
  Derived from openapi/orderco-content-openapi.yml and openapi/orderco-status-openapi.yml, and
  from the live /wp/v2/types and /wp/v2/taxonomies responses saved as
  examples/orderco-content-types.json and examples/orderco-content-taxonomies.json.
summary: >-
  Two disjoint entity graphs, one per published surface. The content graph is the interesting
  one: Order.co registered eight custom WordPress post types and two custom taxonomies, and those
  taxonomies - `industry` and `use_case` - are the join keys that make the marketing corpus
  queryable as data rather than as pages. The status graph is the standard Statuspage shape. The
  procurement domain that actually matters (purchase orders, vendors, invoices, virtual cards,
  approvals, budgets) has no public contract, so no entities from it are modelled here; inventing
  them would be fabrication.
surfaces:
- key: content
  openapi: openapi/orderco-content-openapi.yml
  id_style: integer WordPress post/term ids, unique per type
- key: status
  openapi: openapi/orderco-status-openapi.yml
  id_style: opaque 12-character Statuspage identifiers (e.g. ckzwmwkw4x3f, 729hctp265l8)
