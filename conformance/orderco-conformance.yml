sector_note: >-
  Order.co issues virtual cards and moves payments, and states publicly that it uses Lithic's
  card-issuing API. Card data therefore sits with a PCI-compliant issuer processor rather than
  with Order.co, but Order.co publishes no statement of its own scope or posture either way.
provider_gaps:
- Publish a trust centre naming the certifications the company actually holds.
- Publish /.well-known/security.txt (RFC 9116) with a disclosure contact and policy URL.
- Publish a vulnerability disclosure policy.
- Publish an OpenAPI for the customer API so integrators can evaluate it without a sales call.
