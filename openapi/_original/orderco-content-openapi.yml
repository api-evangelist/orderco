  /cn/v1/resources:
    get:
      operationId: listResources
      summary: Resource hub index
      description: First-party custom namespace registered by the Order.co theme. Returns a `resources`
        array of raw WP post records spanning the blog, ebooks, webinars, tools and customer stories that
        back www.order.co/resources/. The response was 8.9 MB at capture time and the discovery document
        declares no parameters, so there is no server-side paging on this route.
      tags:
      - Newsroom
      responses:
        '200':
          description: Resource records
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
components:
  responses:
    NotFound:
      description: The requested object does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_post_invalid_id
            message: Invalid post ID.
            data:
              status: 404
    InvalidParam:
      description: One or more query parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_invalid_param
            message: 'Invalid parameter(s): per_page'
            data:
              status: 400
              params:
                per_page: per_page must be between 1 (inclusive) and 100 (inclusive)
    Forbidden:
      description: Anonymous access to this route is not permitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: rest_forbidden
            message: Sorry, you are not allowed to access this resource.
            data:
              status: 401
  schemas:
    Error:
      type: object
      description: The WordPress REST error envelope. It is not RFC 9457 problem+json.
      properties:
        code:
          type: string
          description: Machine-readable WordPress error code.
        message:
          type: string
          description: Human-readable message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
            params:
              type: object
            details:
              type: object
      required:
      - code
      - message
      - data
