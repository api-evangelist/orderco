- aid: orderco:orderco-content-api
  name: Order.co Content API
  description: >-
    The public, anonymous WordPress REST API behind www.order.co. It is not the Order.co
    procurement API, but it is a real first-party machine-readable surface and it carries the
    corpus an agent actually wants: 271 blog posts, 47 pages, 36 customer stories, 6 vendor
    stories, 21 ebooks, 10 webinars, 18 tools, 2 spend insights, 873 FAQ records and 142
    testimonials, indexed by the first-party industry and use-case taxonomies Order.co registered
    itself. The discovery document at /wp-json/ declares 226 routes with JSON-Schema-shaped
    parameter definitions; only the anonymously readable content routes are modelled here.
  humanURL: https://www.order.co/resources/
  baseURL: https://www.order.co/wp-json
