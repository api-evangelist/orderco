apis:
- aid: orderco:orderco-status-api
  name: Order.co Status API
  description: >-
    The public, anonymous Atlassian Statuspage v2 API for the Order.co platform, served on
    Order.co's own host status.order.co (page id ckzwmwkw4x3f) and documented by Order.co at
    https://status.order.co/api. Eight GET endpoints return the platform status rollup, the
    single published component (Order.co Application), open and historical incidents with their
    dated updates, and scheduled maintenance windows. No account or credential is required. This
    is the only first-party, self-serve, machine-readable operational API Order.co publishes.
  humanURL: https://status.order.co/
  baseURL: https://status.order.co/api/v2
