aid: orderco
name: Order.co
description: >-
  Order.co (founded 2016 in New York as Negotiatus, rebranded to Order.co in 2021) is a
  procurement and finance-automation platform for mid-market and enterprise buyers: guided
  purchasing across a managed vendor catalog, purchase-order and approval workflow, accounts-
  payable automation, spend management and virtual cards, sold into multi-location operators in
  property management, hospitality, healthcare, retail, fitness, coworking, early childhood
  education, wellness, technology and nonprofit. The product connects to QuickBooks Online,
  NetSuite, Sage Intacct and Workday over API, and supports SSO through Okta and Ping Identity.
  Order.co publishes no developer portal, no API reference and no machine-readable specification
  for any of that - the procurement API is disclosed only to customers, and vendors receive API
  or EDI credentials during onboarding. What it does publish anonymously are two real,
  self-describing surfaces on its own hosts - the WordPress REST API behind www.order.co (blog,
  customer and vendor stories, ebooks, webinars, tools, 873 FAQ records, and the first-party
  industry and use-case taxonomies) and the Atlassian Statuspage v2 API on status.order.co - plus
  an llms.txt and a companion page written for language models.
url: https://raw.githubusercontent.com/api-evangelist/orderco/refs/heads/main/apis.yml
