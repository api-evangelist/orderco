provider_gaps:
- Publish a versioning and deprecation policy for the customer-facing API.
- Emit RFC 8594 Sunset and Deprecation headers when an endpoint is retired.
- Publish a product changelog with dates.
- Break the status page into components that reflect what customers actually integrate with - at
  minimum the API and the accounting integrations, not one component for the whole product.
