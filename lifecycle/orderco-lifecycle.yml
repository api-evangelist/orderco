source: >-
  Live probes of https://status.order.co/, https://status.order.co/api, https://www.order.co/
  and its sitemap, robots.txt and llms.txt, plus the WordPress REST discovery document at
  https://www.order.co/wp-json/, on 2026-08-04.
summary: >-
  Order.co publishes an operational status page and nothing else in the lifecycle family. There
  is no versioning policy, no deprecation policy, no Sunset/Deprecation header support, no
  published SLA and no changelog anywhere on www.order.co - the sitemap carries 998 URLs and not
  one of them is a developer, API, changelog or release-notes page. The two APIs recorded in this
  profile version themselves only by virtue of the platforms they run on: WordPress `wp/v2` and
  Atlassian Statuspage `v2`.
versioning:
