  surfaces:
  - key: content
    base_url: https://www.order.co/wp-json
    current: wp/v2
    note: >-
      WordPress core namespace. The version moves when WordPress moves, not when Order.co decides;
      Order.co has no say in the cadence and publishes no statement about it. Fourteen namespaces
      are advertised in the discovery document, each independently versioned by its plugin.
  - key: status
    base_url: https://status.order.co/api/v2
    current: v2
    note: Atlassian Statuspage v2. Vendor-owned versioning; Order.co publishes no statement about it.
