- target: $.paths['/cn/v1/resources'].get
  update:
    x-response-bytes: 8871210
    x-agent-warning: >-
      8.9 MB unpaginated. It duplicates content already reachable, paged, through the wp/v2
      routes. Prefer those.
    x-verified: '2026-08-04'
